name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [ Release, Debug ]

    steps:
      - uses: actions/checkout@v7

      # the equivalent of a VS x64 developer prompt for the steps below (msbuild, vstest.console)
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        run: msbuild PrelPtp.sln /m /p:Configuration=${{ matrix.configuration }} /p:Platform=x64

      - name: Unit tests
        run: vstest.console x64\${{ matrix.configuration }}\PtpTests.dll /Logger:trx /ResultsDirectory:TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.configuration }}
          path: TestResults

      # Code signing goes here, once SignPath Foundation approves the project (README: Code signing policy).
      # PrelPtp.dll must be signed before PrelPtpSetup.exe is built, because the setup program
      # embeds it; then PrelPtpSetup.exe is signed.

      # PrelPtpSetup.exe is the whole product: PrelPtp.dll, the README and the release notes are built into it
      - name: Upload setup program
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: PrelPtpSetup
          path: x64/Release/PrelPtpSetup.exe

      # for debugging: the diagnostic tools, and the symbols for a crash dump of w32time or the
      # setup program from this build
      - name: Upload debugging files
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: PrelPtp-debug
          path: |
            x64/Release/ts-probe.exe
            x64/Release/ptp-driver.exe
            x64/Release/PrelPtp.pdb
            x64/Release/PrelPtpSetup.pdb

  # A tag v<version> (for example v2.0.0) makes a draft GitHub Release from the Release build, to be
  # checked and published by hand: Releases > the draft > Edit > Publish release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # the tag must match the version built into the programs, and the release notes must have
      # a section for it, which becomes the release's description
      - name: Check the version and get its release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          built=$(sed -n 's/^#define PRODUCT_VER_STR *"\(.*\)".*/\1/p' PrelPtpVersion.h | tr -d '\r')
          if [ "$built" != "$version.0" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in PrelPtpVersion.h ($built)"
            exit 1
          fi
          tr -d '\r' < RELEASE_NOTES.md | awk -v v="$version" '/^## /{ p = ($2 == v); next } p' > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::RELEASE_NOTES.md has no '## $version' section"
            exit 1
          fi
          {
            echo
            echo '---'
            echo
            echo "Download \`PrelPtpSetup.exe\` and run it; see the [README](https://github.com/$GITHUB_REPOSITORY#installing)."
            echo "\`PrelPtp-$version-debug.zip\` has the diagnostic tools and the symbol files for this build."
            echo
            echo "These files are not code-signed yet: see the [Code signing policy](https://github.com/$GITHUB_REPOSITORY#code-signing-policy)."
          } >> notes.md
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          name: PrelPtpSetup
          path: release

      - uses: actions/download-artifact@v8
        with:
          name: PrelPtp-debug
          path: debug

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd debug && zip -r "../release/PrelPtp-$VERSION-debug.zip" .)
          gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag \
            --title "PrelPtp $VERSION" --notes-file notes.md
